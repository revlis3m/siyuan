# revlis3m mods: builds ghcr.io/<owner>/siyuan:<release>-mods.<run> from branch "mods".
name: Mods image

on:
  push:
    branches: [mods]
    paths: ['app/**', 'kernel/**', 'mods-tests/**', 'scripts/prepare-ocr.py', 'scripts/ocr-assets.json', 'docker/Dockerfile.mods', '.github/workflows/mods-image.yml']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: mods-image
  cancel-in-progress: false

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: kernel/go.mod
          cache-dependency-path: kernel/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Kernel builds
        working-directory: kernel
        run: CGO_ENABLED=1 go build -tags "fts5 sqlcipher" -o /tmp/kernel .
      - name: Kernel tests (attribute views)
        working-directory: kernel
        run: CGO_ENABLED=1 go test -tags "fts5 sqlcipher" ./av/ ./apicontract/... && CGO_ENABLED=1 go test -tags "fts5 sqlcipher" ./model/ -run 'Status|Capabilit|AttributeView|NotebookPIN' && CGO_ENABLED=1 go test -tags "fts5 sqlcipher" ./api/ -run 'NotebookPIN'
      - name: Generated API files are current
        working-directory: app
        run: |
          corepack enable
          pnpm install --frozen-lockfile --silent
          pnpm run api:check
      - name: Editor tests (databases and mods)
        working-directory: app
        run: >
          node --import tsx --test --test-concurrency=4
          "src/protyle/render/av/**/*.test.ts"
          src/protyle/util/maskAmountsText.test.ts
          src/config/entryVisibility/catalog.test.ts
          src/protyle/hint/slashMenu.test.ts

  image:
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Tags
        id: meta
        run: |
          release=$(sed -n 's/^ARG BASE_IMAGE=b3log\/siyuan:v//p' docker/Dockerfile.mods)
          owner=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "image=ghcr.io/${owner}/siyuan" >> "$GITHUB_OUTPUT"
          echo "tag=${release}-mods.${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          echo "latest=${release}-mods" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Build the image locally first: it is only published after it has started and passed the checks.
      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.mods
          platforms: linux/amd64
          load: true
          tags: siyuan-mods:candidate
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Start the image
        run: |
          mkdir -p "$RUNNER_TEMP/ws"
          docker run -d --name candidate -p 6806:6806 -v "$RUNNER_TEMP/ws:/siyuan/workspace" \
            -e PUID="$(id -u)" -e PGID="$(id -g)" siyuan-mods:candidate \
            serve --workspace=/siyuan/workspace/ --accessAuthCode=test1234 --lang=en
          for i in $(seq 1 60); do
            if curl -fsS -m 2 -X POST http://127.0.0.1:6806/api/system/version; then echo; exit 0; fi
            sleep 2
          done
          echo "the image did not start"; docker logs --tail 80 candidate; exit 1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Checks on the running image (API and browser)
        working-directory: mods-tests
        env:
          SIYUAN_URL: http://127.0.0.1:6806
          SIYUAN_ACCESS_CODE: test1234
        run: |
          export SIYUAN_WORKSPACE="$RUNNER_TEMP/ws"
          npm install --no-save --no-audit --no-fund playwright@1.63.0
          node api.mjs
          node ui.mjs
      - name: Keep the screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mods-tests-shots
          path: mods-tests/shots
          if-no-files-found: ignore
      - name: Container log when a check fails
        if: failure()
        run: docker logs --tail 120 candidate || true
      - name: Publish
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.mods
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.latest }}
          cache-from: type=gha
      - name: Summary
        run: echo "Built ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}" >> "$GITHUB_STEP_SUMMARY"
