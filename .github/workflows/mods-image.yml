# revlis3m mods: builds ghcr.io/<owner>/siyuan:<release>-mods.<run> from branch "mods".
name: Mods image

on:
  push:
    branches: [mods]
    paths: ['app/**', 'kernel/**', 'scripts/prepare-ocr.py', 'scripts/ocr-assets.json', 'docker/Dockerfile.mods', '.github/workflows/mods-image.yml']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: mods-image
  cancel-in-progress: false

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Tags
        id: meta
        run: |
          release=$(sed -n 's/^ARG BASE_IMAGE=b3log\/siyuan:v//p' docker/Dockerfile.mods)
          owner=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "image=ghcr.io/${owner}/siyuan" >> "$GITHUB_OUTPUT"
          echo "tag=${release}-mods.${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          echo "latest=${release}-mods" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.mods
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.latest }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Summary
        run: echo "Built ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}" >> "$GITHUB_STEP_SUMMARY"
